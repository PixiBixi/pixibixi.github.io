---
name: ci
on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      site: ${{ steps.site-files.outputs.any_changed }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: changed-files
        with:
          files: '**/*.md'
          separator: ','
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          globs: ${{ steps.changed-files.outputs.all_changed_files }}
          separator: ','
          config: .markdownlint.json
      # Repo tooling only: no site build. Skipped jobs still satisfy the required "build" check.
      - uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: site-files
        with:
          files_ignore: |
            AGENTS.md
            README.md
            LICENSE
            renovate.json
            .markdownlint.json
            .pre-commit-config.yaml
            .pre-commit-hooks/**
            .claude/**

  build:
    if: github.event_name == 'workflow_dispatch' || needs.lint.outputs.site == 'true'
    runs-on: ubuntu-26.04
    needs: [lint]
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: mkdocs-privacy-${{ hashFiles('docs/**/*.md') }}
          path: .cache/plugin/privacy
      - run: uv sync
      - run: uv run properdocs build --strict
      # The claude-skills wiki plugin cites anchors of this site: a renamed heading must fail here, not there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: PixiBixi/claude-skills
          path: claude-skills
          persist-credentials: false
      - run: python3 claude-skills/plugins/wiki/check-anchors.py --site site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: mkdocs-privacy-${{ hashFiles('docs/**/*.md') }}
          path: .cache/plugin/privacy
      - run: uv sync
      - run: uv run properdocs gh-deploy --force -d site/
