<svg class="jd-svg" data-jd-theme="" width="640" height="606" viewBox="0 0 640 606" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .box { fill: var(--jd-surface-raised, #161b22); }
    .jd-svg .border { stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .neutral { fill: var(--jd-muted, #8b949e); }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .ok { fill: var(--jd-ok-ink, #3fb950); }
    .jd-svg .ok-s { stroke: var(--jd-ok-ink, #3fb950); }
    .jd-svg .warm { fill: var(--jd-warn-ink, #f78166); }
    .jd-svg .warm-s { stroke: var(--jd-warn-ink, #f78166); }
    .jd-svg .info { fill: var(--jd-note-ink, #58a6ff); }
    .jd-svg .info-s { stroke: var(--jd-note-ink, #58a6ff); }
    .jd-svg .amber { fill: var(--jd-warn-ink, #f9a825); }
    .jd-svg .amber-s { stroke: var(--jd-warn-ink, #f9a825); }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="neutral" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- ── Box: event ── -->
  <rect class="box border" x="80" y="16" width="480" height="52" rx="8" stroke-width="1.5"/>
  <rect class="neutral" x="80" y="16" width="4" height="52" rx="2"/>
  <text class="ink" x="320" y="47" font-size="14" font-weight="600" text-anchor="middle">push  ·  pull_request  (main / master)</text>

  <!-- Arrow: fan-out -->
  <line class="edge" x1="320" y1="68" x2="320" y2="100" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sub" x="330" y="88" font-size="11" text-anchor="start">6 workflows, en parallèle</text>

  <!-- ── Group A: gate ── -->
  <rect class="box border" x="80" y="104" width="480" height="76" rx="8" stroke-width="1.5"/>
  <rect class="ok" x="80" y="104" width="4" height="76" rx="2"/>
  <text class="ok" x="106" y="126" font-size="11" font-weight="700" letter-spacing="0.5">GATE — bloque le merge</text>

  <rect class="box ok-s" x="106" y="140" width="92" height="24" rx="12" stroke-width="1"/>
  <text class="ok" x="152" y="156" font-size="11" text-anchor="middle">test -race</text>
  <rect class="box ok-s" x="206" y="140" width="96" height="24" rx="12" stroke-width="1"/>
  <text class="ok" x="254" y="156" font-size="11" text-anchor="middle">build ×3 OS</text>
  <rect class="box ok-s" x="310" y="140" width="112" height="24" rx="12" stroke-width="1"/>
  <text class="ok" x="366" y="156" font-size="11" text-anchor="middle">golangci-lint</text>
  <rect class="box ok-s" x="430" y="140" width="104" height="24" rx="12" stroke-width="1"/>
  <text class="ok" x="482" y="156" font-size="11" text-anchor="middle">govulncheck</text>

  <!-- ── Group B: reviewdog ── -->
  <rect class="box border" x="80" y="192" width="480" height="64" rx="8" stroke-width="1.5"/>
  <rect class="warm" x="80" y="192" width="4" height="64" rx="2"/>
  <text class="warm" x="106" y="214" font-size="11" font-weight="700" letter-spacing="0.5">FEEDBACK PR — reviewdog (suggestions inline)</text>

  <rect class="box warm-s" x="106" y="226" width="100" height="24" rx="12" stroke-width="1"/>
  <text class="warm" x="156" y="242" font-size="11" text-anchor="middle">goimports</text>
  <rect class="box warm-s" x="214" y="226" width="120" height="24" rx="12" stroke-width="1"/>
  <text class="warm" x="274" y="242" font-size="11" text-anchor="middle">markdownlint</text>

  <!-- ── Group C: security ── -->
  <rect class="box border" x="80" y="268" width="480" height="64" rx="8" stroke-width="1.5"/>
  <rect class="info" x="80" y="268" width="4" height="64" rx="2"/>
  <text class="info" x="106" y="290" font-size="11" font-weight="700" letter-spacing="0.5">SÉCURITÉ — onglet Security</text>

  <rect class="box info-s" x="106" y="302" width="80" height="24" rx="12" stroke-width="1"/>
  <text class="info" x="146" y="318" font-size="11" text-anchor="middle">zizmor</text>
  <text class="sub" x="200" y="318" font-size="12">audite les .github/workflows eux-mêmes</text>

  <!-- Arrow: converge -->
  <line class="edge" x1="320" y1="332" x2="320" y2="368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="ok" x="330" y="354" font-size="11" text-anchor="start">tout vert ✓</text>

  <!-- ── Box: merge ── -->
  <rect class="box border" x="80" y="372" width="480" height="62" rx="8" stroke-width="1.5"/>
  <rect class="ok" x="80" y="372" width="4" height="62" rx="2"/>
  <text class="ink" x="320" y="398" font-size="14" font-weight="600" text-anchor="middle">merge sur main</text>
  <text class="sub" x="320" y="419" font-size="11" text-anchor="middle">Renovate automerge : minor · patch · digest</text>

  <!-- Arrow: push -->
  <line class="edge" x1="320" y1="434" x2="320" y2="470" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sub" x="330" y="456" font-size="11" text-anchor="start">push sur main</text>

  <!-- ── Box: release (tag calculé + goreleaser, même job) ── -->
  <rect class="box border" x="80" y="474" width="480" height="112" rx="8" stroke-width="1.5"/>
  <rect class="warm" x="80" y="474" width="4" height="112" rx="2"/>
  <text class="warm" x="106" y="496" font-size="11" font-weight="700" letter-spacing="0.5">RELEASE — un seul job</text>
  <text class="sub" x="106" y="514" font-size="11">un tag posé par GITHUB_TOKEN ne re-déclenche aucun workflow</text>

  <rect class="box warm-s" x="106" y="524" width="52" height="24" rx="12" stroke-width="1"/>
  <text class="warm" x="132" y="540" font-size="11" text-anchor="middle">svu</text>
  <text class="ink" x="168" y="540" font-size="11">feat → minor · fix → patch · sinon aucun tag</text>

  <rect class="box warm-s" x="106" y="554" width="100" height="24" rx="12" stroke-width="1"/>
  <text class="warm" x="156" y="570" font-size="11" text-anchor="middle">goreleaser</text>
  <text class="ink" x="216" y="570" font-size="11">binaires multi-arch · OCI · cosign · Homebrew</text>

</svg>
