[project]
name = "pixibixi-wiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mkdocs-git-revision-date-localized-plugin==1.6.0",
    "mkdocs-glightbox==0.5.2",
    "mkdocs-minify-plugin==0.8.0",
    "mkdocs-redirects==1.2.3",
    "pillow",
    "cairosvg",
    "mkdocs-rss-plugin==1.19.0",
    "properdocs==1.6.7",
    "mkdocs-materialx==10.2.2",
]

[tool.uv]
# glightbox 0.5.2 drops every <img> with selectolax 1.x (empty <p> in place of each image).
constraint-dependencies = ["selectolax<1"]
# mkdocs-rss-plugin 1.19.0 pins gitpython<3.2, which blocks the RCE fix (Dependabot #13).
override-dependencies = ["gitpython>=3.2.1"]
