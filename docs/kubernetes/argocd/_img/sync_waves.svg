<svg class="jd-svg" data-jd-theme="" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 108" font-family="Inter, Helvetica, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, Inter, Helvetica, sans-serif); }
    .jd-svg .mark { fill: var(--jd-muted, #94a3b8); }
    .jd-svg .badge { fill: var(--jd-ink, #1e293b); }
    .jd-svg .wave { fill: var(--jd-border-strong, #94a3b8); }
    .jd-svg .on-badge { fill: var(--jd-bg, white); }
    .jd-svg .edge { stroke: var(--jd-muted, #94a3b8); }
    .jd-svg .line { stroke: var(--jd-border-strong, #cbd5e1); }
    .jd-svg .pill { fill: var(--jd-surface-raised, #f1f5f9); }
    .jd-svg .ink { fill: var(--jd-ink, #334155); }
    .jd-svg .warm-fill { fill: var(--jd-warn-bg, #fff7ed); }
    .jd-svg .warm-stroke { stroke: var(--jd-warn-border, #fb923c); }
    .jd-svg .violet-fill { fill: var(--jd-surface-raised, #faf5ff); }
    .jd-svg .violet-stroke { stroke: var(--jd-accent, #a855f7); }
    .jd-svg .info-fill { fill: var(--jd-note-bg, #eff6ff); }
    .jd-svg .info-stroke { stroke: var(--jd-note-border, #60a5fa); }
    .jd-svg .ok-fill { fill: var(--jd-ok-bg, #f0fdf4); }
    .jd-svg .ok-stroke { stroke: var(--jd-ok-border, #4ade80); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="mark" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- Badges (cx: 48, 138, 228, 318, 408, 498) -->
  <rect class="badge" x="14"  y="18" width="68" height="28" rx="5"/>
  <rect class="badge" x="104" y="18" width="68" height="28" rx="5"/>
  <rect class="badge" x="194" y="18" width="68" height="28" rx="5"/>
  <rect class="badge" x="284" y="18" width="68" height="28" rx="5"/>
  <rect class="badge" x="374" y="18" width="68" height="28" rx="5"/>
  <rect class="badge" x="464" y="18" width="68" height="28" rx="5"/>

  <!-- Badge labels -->
  <text class="wave" x="48"  y="29" text-anchor="middle" font-size="8.5">wave</text>
  <text class="wave" x="138" y="29" text-anchor="middle" font-size="8.5">wave</text>
  <text class="wave" x="228" y="29" text-anchor="middle" font-size="8.5">wave</text>
  <text class="wave" x="318" y="29" text-anchor="middle" font-size="8.5">wave</text>
  <text class="wave" x="408" y="29" text-anchor="middle" font-size="8.5">wave</text>
  <text class="wave" x="498" y="29" text-anchor="middle" font-size="8.5">wave</text>

  <text class="on-badge" x="48"  y="42" text-anchor="middle" font-size="13" font-weight="700">-1</text>
  <text class="on-badge" x="138" y="42" text-anchor="middle" font-size="13" font-weight="700">0</text>
  <text class="on-badge" x="228" y="42" text-anchor="middle" font-size="13" font-weight="700">1</text>
  <text class="on-badge" x="318" y="42" text-anchor="middle" font-size="13" font-weight="700">2</text>
  <text class="on-badge" x="408" y="42" text-anchor="middle" font-size="13" font-weight="700">3</text>
  <text class="on-badge" x="498" y="42" text-anchor="middle" font-size="13" font-weight="700">4</text>

  <!-- Arrows between badges -->
  <line class="edge" x1="84"  y1="32" x2="102" y2="32" stroke-width="1.5" marker-end="url(#arr)"/>
  <line class="edge" x1="174" y1="32" x2="192" y2="32" stroke-width="1.5" marker-end="url(#arr)"/>
  <line class="edge" x1="264" y1="32" x2="282" y2="32" stroke-width="1.5" marker-end="url(#arr)"/>
  <line class="edge" x1="354" y1="32" x2="372" y2="32" stroke-width="1.5" marker-end="url(#arr)"/>
  <line class="edge" x1="444" y1="32" x2="462" y2="32" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Vertical connectors badge → resource -->
  <line class="line" x1="48"  y1="46" x2="48"  y2="64" stroke-width="1" stroke-dasharray="3,2"/>
  <line class="line" x1="138" y1="46" x2="138" y2="64" stroke-width="1" stroke-dasharray="3,2"/>
  <line class="line" x1="228" y1="46" x2="228" y2="64" stroke-width="1" stroke-dasharray="3,2"/>
  <line class="line" x1="318" y1="46" x2="318" y2="64" stroke-width="1" stroke-dasharray="3,2"/>
  <line class="line" x1="408" y1="46" x2="408" y2="64" stroke-width="1" stroke-dasharray="3,2"/>
  <line class="line" x1="498" y1="46" x2="498" y2="64" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Resource pills (y=66, height=30) -->
  <!-- Wave -1: Namespace -->
  <rect class="pill line" x="10"  y="66" width="76" height="30" rx="5" stroke-width="1.5"/>
  <text class="ink" x="48"  y="85" text-anchor="middle" font-size="11">Namespace</text>

  <!-- Wave 0: ConfigMap + Secret -->
  <rect class="pill line" x="100" y="66" width="76" height="30" rx="5" stroke-width="1.5"/>
  <text class="ink" x="138" y="78" text-anchor="middle" font-size="10">ConfigMap</text>
  <text class="ink" x="138" y="91" text-anchor="middle" font-size="10">Secret</text>

  <!-- Wave 1: StatefulSet postgres -->
  <rect class="warm-fill warm-stroke" x="190" y="66" width="76" height="30" rx="5" stroke-width="1.5"/>
  <text class="ink" x="228" y="78" text-anchor="middle" font-size="10">StatefulSet</text>
  <text class="ink" x="228" y="91" text-anchor="middle" font-size="10">postgres</text>

  <!-- Wave 2: Job migration DB -->
  <rect class="violet-fill violet-stroke" x="280" y="66" width="76" height="30" rx="5" stroke-width="1.5"/>
  <text class="ink" x="318" y="78" text-anchor="middle" font-size="10">Job</text>
  <text class="ink" x="318" y="91" text-anchor="middle" font-size="10">migration DB</text>

  <!-- Wave 3: Deployment backend -->
  <rect class="info-fill info-stroke" x="370" y="66" width="76" height="30" rx="5" stroke-width="1.5"/>
  <text class="ink" x="408" y="78" text-anchor="middle" font-size="10">Deployment</text>
  <text class="ink" x="408" y="91" text-anchor="middle" font-size="10">backend</text>

  <!-- Wave 4: Ingress -->
  <rect class="ok-fill ok-stroke" x="460" y="66" width="76" height="30" rx="5" stroke-width="1.5"/>
  <text class="ink" x="498" y="85" text-anchor="middle" font-size="11">Ingress</text>
</svg>
