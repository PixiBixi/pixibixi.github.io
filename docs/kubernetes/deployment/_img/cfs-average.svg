<svg class="jd-svg" data-jd-theme="" width="640" height="176" viewBox="0 0 640 176" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); font-weight: 600; }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .run { fill: var(--jd-ok-border, #4e8f57); }
    .jd-svg .thr { fill: var(--jd-warn-border, #c9714f); }
    .jd-svg .quota { stroke: var(--jd-bad-ink, #f85149); }
    .jd-svg .quota-t { fill: var(--jd-bad-ink, #f85149); font-weight: 600; }
    .jd-svg .avg { stroke: var(--jd-note-ink, #58a6ff); }
    .jd-svg .avg-t { fill: var(--jd-note-ink, #58a6ff); font-weight: 600; }
  </style>

  <!-- 1px par ms de CPU, base y=150 ; 10 periods de 100ms -->
  <text class="page" x="4" y="12" font-size="10">CPU par period</text>
  <text class="page" x="112" y="30" font-size="10">120ms demandés dans la même period,</text>
  <text class="page" x="112" y="43" font-size="10">dont 20ms au-delà du quota : throttlés</text>

  <rect class="thr" x="65" y="30" width="36" height="18"/>
  <rect class="run" x="65" y="50" width="36" height="100"/>
  <rect class="run" x="111" y="140" width="36" height="10"/>
  <rect class="run" x="157" y="140" width="36" height="10"/>
  <rect class="run" x="203" y="140" width="36" height="10"/>
  <rect class="run" x="249" y="140" width="36" height="10"/>
  <rect class="run" x="295" y="140" width="36" height="10"/>
  <rect class="run" x="341" y="140" width="36" height="10"/>
  <rect class="run" x="387" y="140" width="36" height="10"/>
  <rect class="run" x="433" y="140" width="36" height="10"/>
  <rect class="run" x="479" y="140" width="36" height="10"/>

  <line class="quota" x1="60" y1="50" x2="524" y2="50" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="quota-t" x="530" y="54" font-size="10">quota : 100ms</text>
  <line class="avg" x1="60" y1="129" x2="524" y2="129" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="avg-t" x="530" y="126" font-size="10">moyenne : 21ms</text>
  <text class="avg-t" x="530" y="139" font-size="10">21 % de la limit</text>

  <line class="edge" x1="60" y1="150" x2="524" y2="150" stroke-width="1.5"/>
  <line class="edge" x1="60" y1="20" x2="60" y2="150" stroke-width="1.5"/>
  <text class="page" x="292" y="168" font-size="10" text-anchor="middle">1 seconde = 10 periods de 100ms</text>
</svg>
