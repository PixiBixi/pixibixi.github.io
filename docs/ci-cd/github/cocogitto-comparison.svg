<svg class="jd-svg" data-jd-theme="" width="640" height="340" viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .box { fill: var(--jd-surface-raised, #161b22); }
    .jd-svg .border { stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .neutral { fill: var(--jd-muted, #8b949e); }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .ok { fill: var(--jd-ok-ink, #3fb950); }
    .jd-svg .ok-s { stroke: var(--jd-ok-ink, #3fb950); }
    .jd-svg .warm { fill: var(--jd-warn-ink, #f78166); }
    .jd-svg .warm-s { stroke: var(--jd-warn-ink, #f78166); }
    .jd-svg .info { fill: var(--jd-note-ink, #58a6ff); }
    .jd-svg .info-s { stroke: var(--jd-note-ink, #58a6ff); }
    .jd-svg .amber { fill: var(--jd-warn-ink, #f9a825); }
    .jd-svg .amber-s { stroke: var(--jd-warn-ink, #f9a825); }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="neutral" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text class="ok" x="20" y="15" font-size="12" font-weight="700">cocogitto</text>
  <text class="warm" x="340" y="15" font-size="12" font-weight="700">release-please</text>

  <!-- Separator -->
  <line class="border" x1="320" y1="0" x2="320" y2="340" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══ COCOGITTO ═══ -->

  <!-- Step 1 -->
  <rect class="box border" x="20" y="22" width="280" height="56" rx="8" stroke-width="1.5"/>
  <rect class="info" x="20" y="22" width="4" height="56" rx="2"/>
  <text class="ink" x="44" y="46" font-size="13" font-weight="600">push feat: → master</text>
  <text class="sub" x="44" y="64" font-size="11">Commit poussé directement sur master</text>
  <line class="edge" x1="160" y1="78" x2="160" y2="98" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect class="box border" x="20" y="102" width="280" height="56" rx="8" stroke-width="1.5"/>
  <rect class="ok" x="20" y="102" width="4" height="56" rx="2"/>
  <text class="ink" x="44" y="126" font-size="13" font-weight="600">cog check · cog bump</text>
  <text class="sub" x="44" y="144" font-size="11">Validation + bump semver automatique</text>
  <line class="edge" x1="160" y1="158" x2="160" y2="178" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect class="box border" x="20" y="182" width="280" height="56" rx="8" stroke-width="1.5"/>
  <rect class="ok" x="20" y="182" width="4" height="56" rx="2"/>
  <text class="ink" x="44" y="206" font-size="13" font-weight="600">git push · git push tag</text>
  <text class="sub" x="44" y="224" font-size="11">Tag vX.Y.Z poussé, CHANGELOG mis à jour</text>
  <line class="edge" x1="160" y1="238" x2="160" y2="258" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect class="box border" x="20" y="262" width="280" height="56" rx="8" stroke-width="1.5"/>
  <rect class="warm" x="20" y="262" width="4" height="56" rx="2"/>
  <text class="ink" x="44" y="286" font-size="13" font-weight="600">GitHub Release · Docker build</text>
  <text class="sub" x="44" y="304" font-size="11">Release + image OCI en un seul trigger</text>

  <!-- ═══ RELEASE-PLEASE ═══ -->

  <!-- Step 1 -->
  <rect class="box border" x="340" y="22" width="280" height="56" rx="8" stroke-width="1.5"/>
  <rect class="info" x="340" y="22" width="4" height="56" rx="2"/>
  <text class="ink" x="364" y="46" font-size="13" font-weight="600">push feat: → master</text>
  <text class="sub" x="364" y="64" font-size="11">Commit poussé</text>
  <line class="edge" x1="480" y1="78" x2="480" y2="98" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect class="box border" x="340" y="102" width="280" height="56" rx="8" stroke-width="1.5"/>
  <rect class="neutral" x="340" y="102" width="4" height="56" rx="2"/>
  <text class="ink" x="364" y="126" font-size="13" font-weight="600">CI ouvre une Release PR</text>
  <text class="sub" x="364" y="144" font-size="11">Accumule les commits depuis la dernière release</text>
  <line class="edge" x1="480" y1="158" x2="480" y2="178" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 — manual gate -->
  <rect class="box amber-s" x="340" y="182" width="280" height="56" rx="8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect class="amber" x="340" y="182" width="4" height="56" rx="2"/>
  <text class="ink" x="364" y="206" font-size="13" font-weight="600">✋ review → merge</text>
  <text class="sub" x="364" y="224" font-size="11">Gate humain — la release attend le merge</text>
  <line class="edge" x1="480" y1="238" x2="480" y2="258" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect class="box border" x="340" y="262" width="280" height="56" rx="8" stroke-width="1.5"/>
  <rect class="warm" x="340" y="262" width="4" height="56" rx="2"/>
  <text class="ink" x="364" y="286" font-size="13" font-weight="600">GitHub Release</text>
  <text class="sub" x="364" y="304" font-size="11">Créée automatiquement après le merge</text>

</svg>
