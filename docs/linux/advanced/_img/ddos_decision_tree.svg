<svg font-family="sans-serif" class="jd-svg" data-jd-theme="" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 1100" width="830" height="1100">
  <style>
    .jd-svg text { font-family: var(--jd-sans, sans-serif); }
    .jd-svg .mark { fill: var(--jd-muted, #546e7a); }
    .jd-svg .start { fill: var(--jd-note-border, #1565c0); }
    .jd-svg .ink { fill: var(--jd-ink, white); }
    .jd-svg .edge { stroke: var(--jd-muted, #546e7a); }
    .jd-svg .step { fill: var(--jd-border-strong, #37474f); }
    .jd-svg .decision { fill: var(--jd-warn-border, #e65100); }
    .jd-svg .yes { fill: var(--jd-ok-ink, #2e7d32); }
    .jd-svg .action { fill: var(--jd-ok-border, #2e7d32); }
    .jd-svg .no { fill: var(--jd-bad-ink, #c62828); }
    .jd-svg .tuning { fill: var(--jd-note-border, #6a1b9a); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon class="mark" points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- START -->
  <rect class="start" x="215" y="18" width="270" height="46" rx="23"/>
  <text class="ink" x="350" y="41" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">DDoS L7 détecté</text>

  <!-- Start → Analyser -->
  <line class="edge" x1="350" y1="64" x2="350" y2="94" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ANALYSER -->
  <rect class="step" x="195" y="95" width="310" height="44" rx="6"/>
  <text class="ink" x="350" y="117" font-size="13" text-anchor="middle" dominant-baseline="middle">Analyser : logs, ss, netstat</text>

  <!-- Analyser → D1 -->
  <line class="edge" x1="350" y1="139" x2="350" y2="172" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- D1 : IPs peu nombreuses ? (center 215) -->
  <polygon class="decision" points="350,173 490,215 350,257 210,215"/>
  <text class="ink" x="350" y="208" font-size="12" text-anchor="middle" dominant-baseline="auto">IPs sources</text>
  <text class="ink" x="350" y="224" font-size="12" text-anchor="middle" dominant-baseline="auto">peu nombreuses ?</text>
  <line class="edge" x1="490" y1="215" x2="568" y2="215" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="yes" x="505" y="207" font-size="11" font-weight="bold">OUI</text>
  <rect class="action" x="569" y="192" width="240" height="46" rx="6"/>
  <text class="ink" x="689" y="208" font-size="12" text-anchor="middle" dominant-baseline="auto">iptables -I INPUT</text>
  <text class="ink" x="689" y="224" font-size="12" text-anchor="middle" dominant-baseline="auto">-s &lt;IP&gt; -j DROP</text>
  <line class="edge" x1="350" y1="257" x2="350" y2="292" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="no" x="358" y="275" font-size="11" font-weight="bold">NON</text>

  <!-- D2 : User-Agent identifiable ? (center 335) -->
  <polygon class="decision" points="350,293 490,335 350,377 210,335"/>
  <text class="ink" x="350" y="328" font-size="12" text-anchor="middle" dominant-baseline="auto">User-Agent</text>
  <text class="ink" x="350" y="344" font-size="12" text-anchor="middle" dominant-baseline="auto">identifiable ?</text>
  <line class="edge" x1="490" y1="335" x2="568" y2="335" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="yes" x="505" y="327" font-size="11" font-weight="bold">OUI</text>
  <rect class="action" x="569" y="312" width="240" height="46" rx="6"/>
  <text class="ink" x="689" y="328" font-size="12" text-anchor="middle" dominant-baseline="auto">Drop UA</text>
  <text class="ink" x="689" y="344" font-size="12" text-anchor="middle" dominant-baseline="auto">HAProxy / nginx</text>
  <line class="edge" x1="350" y1="377" x2="350" y2="412" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="no" x="358" y="395" font-size="11" font-weight="bold">NON</text>

  <!-- D3 : Pays source suspect ? (center 455) -->
  <polygon class="decision" points="350,413 490,455 350,497 210,455"/>
  <text class="ink" x="350" y="448" font-size="12" text-anchor="middle" dominant-baseline="auto">Pays source</text>
  <text class="ink" x="350" y="464" font-size="12" text-anchor="middle" dominant-baseline="auto">suspect ?</text>
  <line class="edge" x1="490" y1="455" x2="568" y2="455" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="yes" x="505" y="447" font-size="11" font-weight="bold">OUI</text>
  <rect class="action" x="569" y="432" width="240" height="46" rx="6"/>
  <text class="ink" x="689" y="448" font-size="12" text-anchor="middle" dominant-baseline="auto">ipset blocklist pays</text>
  <text class="ink" x="689" y="464" font-size="12" text-anchor="middle" dominant-baseline="auto">(ipdeny.com)</text>
  <line class="edge" x1="350" y1="497" x2="350" y2="532" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="no" x="358" y="515" font-size="11" font-weight="bold">NON</text>

  <!-- D4 : Page ciblée unique ? (center 575) -->
  <polygon class="decision" points="350,533 490,575 350,617 210,575"/>
  <text class="ink" x="350" y="568" font-size="12" text-anchor="middle" dominant-baseline="auto">Page ciblée</text>
  <text class="ink" x="350" y="584" font-size="12" text-anchor="middle" dominant-baseline="auto">unique ?</text>
  <line class="edge" x1="490" y1="575" x2="568" y2="575" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="yes" x="505" y="567" font-size="11" font-weight="bold">OUI</text>
  <rect class="action" x="569" y="552" width="240" height="46" rx="6"/>
  <text class="ink" x="689" y="566" font-size="12" text-anchor="middle" dominant-baseline="auto">Pool FPM dédié</text>
  <text class="ink" x="689" y="582" font-size="12" text-anchor="middle" dominant-baseline="auto">+ rate limit nginx</text>
  <line class="edge" x1="350" y1="617" x2="350" y2="652" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="no" x="358" y="635" font-size="11" font-weight="bold">NON</text>

  <!-- D5 : HTTP 1.0/1.1 pur ? (center 695) -->
  <polygon class="decision" points="350,653 490,695 350,737 210,695"/>
  <text class="ink" x="350" y="688" font-size="12" text-anchor="middle" dominant-baseline="auto">Trafic HTTP</text>
  <text class="ink" x="350" y="704" font-size="12" text-anchor="middle" dominant-baseline="auto">1.0 / 1.1 pur ?</text>
  <line class="edge" x1="490" y1="695" x2="568" y2="695" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="yes" x="505" y="687" font-size="11" font-weight="bold">OUI</text>
  <rect class="action" x="569" y="672" width="240" height="46" rx="6"/>
  <text class="ink" x="689" y="688" font-size="12" text-anchor="middle" dominant-baseline="auto">Forcer HTTP/2</text>
  <text class="ink" x="689" y="704" font-size="12" text-anchor="middle" dominant-baseline="auto">rejeter HTTP/1.0</text>
  <line class="edge" x1="350" y1="737" x2="350" y2="772" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="no" x="358" y="755" font-size="11" font-weight="bold">NON</text>

  <!-- D6 : TLS < 1.2 ? (center 815) -->
  <polygon class="decision" points="350,773 490,815 350,857 210,815"/>
  <text class="ink" x="350" y="808" font-size="12" text-anchor="middle" dominant-baseline="auto">TLS</text>
  <text class="ink" x="350" y="824" font-size="12" text-anchor="middle" dominant-baseline="auto">&lt; 1.2 ?</text>
  <line class="edge" x1="490" y1="815" x2="568" y2="815" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="yes" x="505" y="807" font-size="11" font-weight="bold">OUI</text>
  <rect class="action" x="569" y="792" width="240" height="46" rx="6"/>
  <text class="ink" x="689" y="808" font-size="12" text-anchor="middle" dominant-baseline="auto">Drop TLS &lt; 1.2</text>
  <text class="ink" x="689" y="824" font-size="12" text-anchor="middle" dominant-baseline="auto">dans HAProxy</text>
  <line class="edge" x1="350" y1="857" x2="350" y2="892" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="no" x="358" y="875" font-size="11" font-weight="bold">NON</text>

  <!-- D7 : Stack saturée ? (center 935) -->
  <polygon class="decision" points="350,893 490,935 350,977 210,935"/>
  <text class="ink" x="350" y="928" font-size="12" text-anchor="middle" dominant-baseline="auto">Stack applicative</text>
  <text class="ink" x="350" y="944" font-size="12" text-anchor="middle" dominant-baseline="auto">saturée ?</text>
  <line class="edge" x1="490" y1="935" x2="568" y2="935" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="yes" x="505" y="927" font-size="11" font-weight="bold">OUI</text>
  <rect class="tuning" x="569" y="912" width="240" height="46" rx="6"/>
  <text class="ink" x="689" y="928" font-size="12" text-anchor="middle" dominant-baseline="auto">Tuner timeouts</text>
  <text class="ink" x="689" y="944" font-size="12" text-anchor="middle" dominant-baseline="auto">+ maxconn stack</text>
  <line class="edge" x1="350" y1="977" x2="350" y2="1012" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="no" x="358" y="995" font-size="11" font-weight="bold">NON</text>

  <!-- END -->
  <rect class="start" x="215" y="1013" width="270" height="46" rx="23"/>
  <text class="ink" x="350" y="1036" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Monitorer · itérer</text>

  <!-- Légende -->
  <rect class="decision" x="20" y="980" width="16" height="16" rx="3"/>
  <text class="page" x="42" y="992" font-size="11" font-weight="600" dominant-baseline="middle">Décision</text>
  <rect class="action" x="20" y="1002" width="16" height="16" rx="3"/>
  <text class="page" x="42" y="1014" font-size="11" font-weight="600" dominant-baseline="middle">Action réseau / HTTP</text>
  <rect class="tuning" x="20" y="1024" width="16" height="16" rx="3"/>
  <text class="page" x="42" y="1036" font-size="11" font-weight="600" dominant-baseline="middle">Tuning applicatif</text>
</svg>
