<svg class="jd-svg" data-jd-theme="" width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .axis { stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .info-fill { fill: var(--jd-note-border, #5b8fc9); }
    .jd-svg .ok-fill { fill: var(--jd-ok-border, #4e8f57); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); }
    .jd-svg .warm-fill { fill: var(--jd-warn-border, #c9714f); }
  </style>
  <!-- axe -->
  <line class="axis" x1="24" y1="108" x2="616" y2="108" stroke-width="1"/>
  <text class="page" x="24" y="126" font-size="9" font-weight="600">0</text>
  <text class="page" x="72" y="126" font-size="9" font-weight="600">45 j</text>
  <text class="page" x="152" y="126" font-size="9" font-weight="600">135 j</text>
  <text class="page" x="586" y="126" font-size="9" font-weight="600">565 j</text>

  <!-- palier raw : 45 j, resolution native -->
  <rect class="warm-fill" x="24" y="46" width="45" height="62"/>
  <text class="page" x="24" y="38" font-size="11" font-weight="600">raw</text>
  <text class="page" x="24" y="22" font-size="9" font-weight="600">45 j · 15 s</text>

  <!-- palier 5m : 90 j -->
  <rect class="info-fill" x="71" y="76" width="92" height="32"/>
  <text class="page" x="80" y="68" font-size="11" font-weight="600">5 m</text>
  <text class="page" x="80" y="52" font-size="9" font-weight="600">90 j · 20× moins de points</text>

  <!-- palier 1h : 430 j -->
  <rect class="ok-fill" x="165" y="94" width="451" height="14"/>
  <text class="page" x="176" y="88" font-size="11" font-weight="600">1h</text>
  <text class="page" x="212" y="88" font-size="9" font-weight="600">430 j · 240× moins de points que le raw</text>

  <!-- legende -->
  <text class="page" x="24" y="148" font-size="10" font-weight="600">Largeur = durée de rétention. Hauteur = volume par jour (indicatif) : la longue traîne ne coûte presque rien.</text>
</svg>
