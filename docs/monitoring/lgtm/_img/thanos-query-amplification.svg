<svg width="640" height="290" viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- etage 1 : la requete utilisateur -->
  <rect x="60" y="30" width="340" height="44" rx="3" fill="#161b22" stroke="#30363d"/>
  <rect x="60" y="30" width="4" height="44" fill="#58a6ff"/>
  <text x="76" y="50" fill="#e6edf3" font-size="11">1 requête query_range</text>
  <text x="76" y="65" fill="#8b949e" font-size="9">un panel, un refresh de dashboard</text>

  <line x1="230" y1="74" x2="230" y2="102" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <text x="414" y="84" fill="#6e7781" font-size="9" font-weight="600">le query frontend découpe la requête</text>
  <text x="414" y="96" fill="#6e7781" font-size="9" font-weight="600">par --query-range.split-interval</text>

  <!-- etage 2 : les sous-requetes -->
  <rect x="60" y="108" width="340" height="44" rx="3" fill="#161b22" stroke="#30363d"/>
  <rect x="60" y="108" width="4" height="44" fill="#c9714f"/>
  <text x="76" y="128" fill="#e6edf3" font-size="11">N sous-requêtes tirées en concurrence</text>
  <text x="76" y="143" fill="#8b949e" font-size="9">N plafonné par --query-range.max-query-parallelism</text>

  <line x1="230" y1="152" x2="230" y2="180" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <text x="414" y="162" fill="#6e7781" font-size="9" font-weight="600">le querier diffuse chaque sous-requête</text>
  <text x="414" y="174" fill="#6e7781" font-size="9" font-weight="600">à toutes les stacks de la flotte</text>

  <!-- etage 3 : ce qui arrive sur une gate -->
  <rect x="60" y="186" width="340" height="44" rx="3" fill="#161b22" stroke="#30363d"/>
  <rect x="60" y="186" width="4" height="44" fill="#4e8f57"/>
  <text x="76" y="206" fill="#e6edf3" font-size="11">Au moins N Series calls concurrents par store gateway</text>
  <text x="76" y="221" fill="#8b949e" font-size="9">un par sélecteur, plafonné par --query.max-concurrent-select</text>

  <text x="414" y="204" fill="#6e7781" font-size="9" font-weight="600">sur un pod : N × selects</text>
  <text x="414" y="216" fill="#6e7781" font-size="9" font-weight="600">sur la flotte : N × le nombre de stacks</text>

  <!-- l invariant -->
  <rect x="60" y="248" width="500" height="28" rx="12" fill="#161b22" stroke="#c9714f"/>
  <text x="80" y="266" fill="#e6edf3" font-size="10">N × selects ≥ le cap de la gate : une seule requête suffit à la saturer</text>
</svg>
