<svg class="jd-svg" data-jd-theme="" width="640" height="290" viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .border { stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .box-fill { fill: var(--jd-surface-raised, #161b22); }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .info-bar { fill: var(--jd-note-ink, #58a6ff); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .muted-fill { fill: var(--jd-muted, #8b949e); }
    .jd-svg .ok-bar { fill: var(--jd-ok-ink, #4e8f57); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .warm-bar { fill: var(--jd-warn-ink, #c9714f); }
    .jd-svg .warm-stroke { stroke: var(--jd-warn-ink, #c9714f); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="muted-fill" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- etage 1 : la requete utilisateur -->
  <rect class="box-fill border" x="60" y="30" width="340" height="44" rx="3"/>
  <rect class="info-bar" x="60" y="30" width="4" height="44"/>
  <text class="ink" x="76" y="50" font-size="11">1 requête query_range</text>
  <text class="sub" x="76" y="65" font-size="9">un panel, un refresh de dashboard</text>

  <line class="edge" x1="230" y1="74" x2="230" y2="102" stroke-width="1" marker-end="url(#arr)"/>
  <text class="page" x="414" y="84" font-size="9" font-weight="600">le query frontend découpe la requête</text>
  <text class="page" x="414" y="96" font-size="9" font-weight="600">par --query-range.split-interval</text>

  <!-- etage 2 : les sous-requetes -->
  <rect class="box-fill border" x="60" y="108" width="340" height="44" rx="3"/>
  <rect class="warm-bar" x="60" y="108" width="4" height="44"/>
  <text class="ink" x="76" y="128" font-size="11">N sous-requêtes tirées en concurrence</text>
  <text class="sub" x="76" y="143" font-size="9">N plafonné par --query-range.max-query-parallelism</text>

  <line class="edge" x1="230" y1="152" x2="230" y2="180" stroke-width="1" marker-end="url(#arr)"/>
  <text class="page" x="414" y="162" font-size="9" font-weight="600">le querier diffuse chaque sous-requête</text>
  <text class="page" x="414" y="174" font-size="9" font-weight="600">à toutes les stacks de la flotte</text>

  <!-- etage 3 : ce qui arrive sur une gate -->
  <rect class="box-fill border" x="60" y="186" width="340" height="44" rx="3"/>
  <rect class="ok-bar" x="60" y="186" width="4" height="44"/>
  <text class="ink" x="76" y="206" font-size="11">Au moins N Series calls concurrents par store gateway</text>
  <text class="sub" x="76" y="221" font-size="9">un par sélecteur, plafonné par --query.max-concurrent-select</text>

  <text class="page" x="414" y="204" font-size="9" font-weight="600">sur un pod : N × selects</text>
  <text class="page" x="414" y="216" font-size="9" font-weight="600">sur la flotte : N × le nombre de stacks</text>

  <!-- l invariant -->
  <rect class="box-fill warm-stroke" x="60" y="248" width="500" height="28" rx="12"/>
  <text class="ink" x="80" y="266" font-size="10">N × selects ≥ le cap de la gate : une seule requête suffit à la saturer</text>
</svg>
