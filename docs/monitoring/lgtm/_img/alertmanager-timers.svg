<svg class="jd-svg" data-jd-theme="" width="760" height="180" viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <!-- Timers of one aggregation group, defaults of DefaultRouteOpts (dispatch/route.go, v0.35.0).
       Schematic time axis, not proportional. -->
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .box { fill: var(--jd-surface-raised, #161b22); stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); font-weight: 600; }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); fill: none; }
    .jd-svg .neutral { fill: var(--jd-muted, #8b949e); }
    .jd-svg .info { fill: var(--jd-note-ink, #58a6ff); }
    .jd-svg .warm { fill: var(--jd-warn-ink, #f78166); }
    .jd-svg .ok { fill: var(--jd-ok-ink, #3fb950); }
    .jd-svg .s-info { stroke: var(--jd-note-ink, #58a6ff); fill: none; }
    .jd-svg .s-warm { stroke: var(--jd-warn-ink, #f78166); fill: none; }
    .jd-svg .s-ok { stroke: var(--jd-ok-ink, #3fb950); fill: none; }
    .jd-svg .dashed { fill: var(--jd-surface-raised, #161b22); stroke: var(--jd-muted, #8b949e); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="neutral" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- timers, row 1 -->
  <path class="s-info" d="M 40 36 V 44 H 150 V 36" stroke-width="1.5"/>
  <text class="page" x="95" y="30" font-size="10" text-anchor="middle">group_wait 30s</text>
  <path class="s-warm" d="M 150 36 V 44 H 330 V 36" stroke-width="1.5"/>
  <text class="page" x="240" y="30" font-size="10" text-anchor="middle">group_interval 5m</text>
  <path class="s-warm" d="M 330 36 V 44 H 490 V 36" stroke-width="1.5"/>
  <text class="page" x="410" y="30" font-size="10" text-anchor="middle">group_interval 5m</text>
  <text class="page" x="560" y="30" font-size="10" text-anchor="middle">puis toutes les 5m</text>

  <!-- timers, row 2 -->
  <path class="s-ok" d="M 330 62 V 70 H 680 V 62" stroke-width="1.5"/>
  <text class="page" x="505" y="58" font-size="10" text-anchor="middle">repeat_interval 4h, compté depuis le dernier envoi</text>

  <!-- axis with a break -->
  <line class="edge" x1="20" y1="100" x2="578" y2="100" stroke-width="1.5"/>
  <line class="edge" x1="592" y1="100" x2="748" y2="100" stroke-width="1.5" marker-end="url(#arr)"/>
  <line class="edge" x1="574" y1="108" x2="582" y2="92" stroke-width="1.5"/>
  <line class="edge" x1="588" y1="108" x2="596" y2="92" stroke-width="1.5"/>

  <!-- alert arrivals -->
  <polygon class="neutral" points="40 94, 46 100, 40 106, 34 100"/>
  <text class="page" x="40" y="88" font-size="10" text-anchor="middle">alerte A</text>
  <polygon class="neutral" points="230 94, 236 100, 230 106, 224 100"/>
  <text class="page" x="230" y="88" font-size="10" text-anchor="middle">alerte B (1m)</text>

  <!-- flush ticks -->
  <circle class="info" cx="150" cy="100" r="4"/>
  <circle class="warm" cx="330" cy="100" r="4"/>
  <circle class="warm" cx="490" cy="100" r="4"/>
  <circle class="ok" cx="680" cy="100" r="4"/>
  <text class="page" x="40" y="120" font-size="10" text-anchor="middle">0</text>
  <text class="page" x="150" y="120" font-size="10" text-anchor="middle">30s</text>
  <text class="page" x="330" y="120" font-size="10" text-anchor="middle">5m30s</text>
  <text class="page" x="490" y="120" font-size="10" text-anchor="middle">10m30s</text>
  <text class="page" x="680" y="120" font-size="10" text-anchor="middle">4h05m30s</text>

  <!-- notifications -->
  <g>
    <rect class="box" x="90" y="132" width="120" height="38" rx="4"/>
    <rect class="info" x="90" y="132" width="4" height="38"/>
    <text class="ink" x="102" y="148" font-size="11">Slack : A</text>
    <text class="sub" x="102" y="162" font-size="10">fin de group_wait</text>
  </g>
  <g>
    <rect class="box" x="270" y="132" width="120" height="38" rx="4"/>
    <rect class="warm" x="270" y="132" width="4" height="38"/>
    <text class="ink" x="282" y="148" font-size="11">Slack : A + B</text>
    <text class="sub" x="282" y="162" font-size="10">nouvelle alerte</text>
  </g>
  <g>
    <rect class="dashed" x="430" y="132" width="120" height="38" rx="4"/>
    <text class="ink" x="442" y="148" font-size="11">pas d'envoi</text>
    <text class="sub" x="442" y="162" font-size="10">rien n'a changé</text>
  </g>
  <g>
    <rect class="box" x="612" y="132" width="136" height="38" rx="4"/>
    <rect class="ok" x="612" y="132" width="4" height="38"/>
    <text class="ink" x="624" y="148" font-size="11">Slack : A + B</text>
    <text class="sub" x="624" y="162" font-size="10">repeat_interval écoulé</text>
  </g>
</svg>
