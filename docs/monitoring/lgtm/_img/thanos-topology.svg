<svg class="jd-svg" data-jd-theme="" width="640" height="336" viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .border { stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .box-fill { fill: var(--jd-surface-raised, #161b22); }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .info-stroke { stroke: var(--jd-note-ink, #58a6ff); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .inner-fill { fill: var(--jd-surface, #0d1117); }
    .jd-svg .muted-fill { fill: var(--jd-muted, #8b949e); }
    .jd-svg .ok-bar { fill: var(--jd-ok-ink, #3fb950); }
    .jd-svg .ok-stroke { stroke: var(--jd-ok-ink, #3fb950); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .warm-stroke { stroke: var(--jd-warn-ink, #f78166); }
  </style>
  <defs>
    <marker id="up" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <polygon class="muted-fill" points="0 6, 4 0, 8 6"/>
    </marker>
  </defs>

  <!-- Grafana -->
  <rect class="box-fill border" x="258" y="8" width="124" height="30" rx="4"/>
  <rect class="muted-fill" x="258" y="8" width="4" height="30"/>
  <text class="ink" x="274" y="28" font-size="12">Grafana</text>
  <line class="edge" x1="320" y1="66" x2="320" y2="42" stroke-width="1.5" marker-end="url(#up)"/>

  <!-- Querier global -->
  <rect class="box-fill border" x="150" y="68" width="200" height="42" rx="4"/>
  <rect class="ok-bar" x="150" y="68" width="4" height="42"/>
  <text class="ink" x="166" y="86" font-size="12">Querier global</text>
  <text class="sub" x="166" y="101" font-size="9">fan-out sur tous les queriers régionaux</text>

  <!-- Querier global restreint -->
  <rect class="box-fill border" x="366" y="68" width="180" height="42" rx="4" stroke-dasharray="4 3"/>
  <rect class="ok-bar" x="366" y="68" width="4" height="42"/>
  <text class="ink" x="382" y="86" font-size="12">Querier global restreint</text>
  <text class="sub" x="382" y="101" font-size="9">sous-ensemble de tenants</text>

  <!-- fan-out : bus horizontal, les stacks y remontent -->
  <line class="edge" x1="78" y1="126" x2="494" y2="126" stroke-width="1"/>
  <line class="edge" x1="78" y1="146" x2="78" y2="127" stroke-width="1.5"/>
  <line class="edge" x1="286" y1="146" x2="286" y2="127" stroke-width="1.5"/>
  <line class="edge" x1="494" y1="146" x2="494" y2="127" stroke-width="1.5"/>
  <line class="edge" x1="250" y1="126" x2="250" y2="112" stroke-width="1.5" marker-end="url(#up)"/>
  <line class="edge" x1="456" y1="126" x2="456" y2="112" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#up)"/>

  <!-- 3 stacks tenant -->
  <g>
    <rect class="box-fill border" x="8" y="148" width="140" height="118" rx="4"/>
    <text class="sub" x="18" y="164" font-size="9" font-weight="600">tenant A · namespace</text>
    <rect class="inner-fill ok-stroke" x="18" y="170" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="26" y="184" font-size="9">querier + frontend</text>
    <rect class="inner-fill ok-stroke" x="18" y="194" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="26" y="208" font-size="9">store gw · 3 shards</text>
    <rect class="inner-fill warm-stroke" x="18" y="218" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="26" y="232" font-size="9">receive</text>
    <rect class="inner-fill info-stroke" x="18" y="242" width="120" height="18" rx="3" stroke-width="0.8"/>
    <text class="ink" x="26" y="255" font-size="9">bucket dédié</text>
  </g>
  <g>
    <rect class="box-fill border" x="216" y="148" width="140" height="118" rx="4"/>
    <text class="sub" x="226" y="164" font-size="9" font-weight="600">tenant B · namespace</text>
    <rect class="inner-fill ok-stroke" x="226" y="170" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="234" y="184" font-size="9">querier + frontend</text>
    <rect class="inner-fill ok-stroke" x="226" y="194" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="234" y="208" font-size="9">store gw · 3 shards</text>
    <rect class="inner-fill warm-stroke" x="226" y="218" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="234" y="232" font-size="9">receive</text>
    <rect class="inner-fill info-stroke" x="226" y="242" width="120" height="18" rx="3" stroke-width="0.8"/>
    <text class="ink" x="234" y="255" font-size="9">bucket dédié</text>
  </g>
  <g>
    <rect class="box-fill border" x="424" y="148" width="140" height="118" rx="4"/>
    <text class="sub" x="434" y="164" font-size="9" font-weight="600">tenant C · namespace</text>
    <rect class="inner-fill ok-stroke" x="434" y="170" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="442" y="184" font-size="9">querier + frontend</text>
    <rect class="inner-fill ok-stroke" x="434" y="194" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="442" y="208" font-size="9">store gw · 3 shards</text>
    <rect class="inner-fill warm-stroke" x="434" y="218" width="120" height="20" rx="3" stroke-width="0.8"/>
    <text class="ink" x="442" y="232" font-size="9">receive</text>
    <rect class="inner-fill info-stroke" x="434" y="242" width="120" height="18" rx="3" stroke-width="0.8"/>
    <text class="ink" x="442" y="255" font-size="9">bucket dédié</text>
  </g>
  <text class="page" x="578" y="212" font-size="11" font-weight="600">× N</text>

  <!-- remote_write depuis les Prometheus -->
  <line class="edge" x1="78" y1="300" x2="78" y2="272" stroke-width="1.5" marker-end="url(#up)"/>
  <line class="edge" x1="286" y1="300" x2="286" y2="272" stroke-width="1.5" marker-end="url(#up)"/>
  <line class="edge" x1="494" y1="300" x2="494" y2="272" stroke-width="1.5" marker-end="url(#up)"/>
  <text class="page" x="92" y="288" font-size="9" font-weight="600">remote_write</text>

  <rect class="box-fill border" x="8" y="302" width="556" height="26" rx="4"/>
  <rect class="muted-fill" x="8" y="302" width="4" height="26"/>
  <text class="ink" x="24" y="319" font-size="11">Un Prometheus par cluster source</text>
</svg>
