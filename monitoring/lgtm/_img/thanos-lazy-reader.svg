<svg class="jd-svg" data-jd-theme="" width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .box-fill { fill: var(--jd-surface-raised, #161b22); }
    .jd-svg .box-stroke { stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .ok { fill: var(--jd-ok-ink, #3fb950); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .info { fill: var(--jd-note-ink, #58a6ff); }
    .jd-svg .warm { fill: var(--jd-warn-ink, #f78166); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="sub" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- 1 : résident -->
  <g>
    <rect class="box-fill box-stroke" x="7" y="34" width="140" height="76" rx="4"/>
    <rect class="ok" x="7" y="34" width="4" height="76"/>
    <text class="ink" x="23" y="56" font-size="12">Header résident</text>
    <text class="sub" x="23" y="76" font-size="10">mmap en mémoire</text>
    <text class="ok" x="23" y="92" font-size="10">requêtes rapides</text>
  </g>

  <!-- 2 : déchargé -->
  <path class="edge" d="M 147 72 L 163 72" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <g>
    <rect class="box-fill box-stroke" x="169" y="34" width="140" height="76" rx="4"/>
    <rect class="sub" x="169" y="34" width="4" height="76"/>
    <text class="ink" x="185" y="56" font-size="12">5 min sans requête</text>
    <text class="sub" x="185" y="76" font-size="10">timeout d'inactivité</text>
    <text class="sub" x="185" y="92" font-size="10">header déchargé</text>
  </g>

  <!-- 3 : requête suivante -->
  <path class="edge" d="M 309 72 L 325 72" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <g>
    <rect class="box-fill box-stroke" x="331" y="34" width="140" height="76" rx="4"/>
    <rect class="info" x="331" y="34" width="4" height="76"/>
    <text class="ink" x="347" y="56" font-size="12">Requête suivante</text>
    <text class="sub" x="347" y="76" font-size="10">touche un bloc froid</text>
    <text class="sub" x="347" y="92" font-size="10">attend avant de lire</text>
  </g>

  <!-- 4 : rechargement -->
  <path class="edge" d="M 471 72 L 487 72" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <g>
    <rect class="box-fill box-stroke" x="493" y="34" width="140" height="76" rx="4"/>
    <rect class="warm" x="493" y="34" width="4" height="76"/>
    <text class="ink" x="509" y="56" font-size="12">Rechargement</text>
    <text class="sub" x="509" y="76" font-size="10">relit tout le fichier</text>
    <text class="warm" x="509" y="92" font-size="10">20 s, 114 s au p99</text>
  </g>

  <!-- boucle de retour -->
  <path class="edge" d="M 563 110 L 563 144 Q 563 150 557 150 L 83 150 Q 77 150 77 144 L 77 116"
        stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>

  <text class="page" x="320" y="182" font-size="11" font-weight="600" text-anchor="middle">Le cycle recommence à chaque accalmie et le coût retombe sur la requête suivante.</text>
</svg>
