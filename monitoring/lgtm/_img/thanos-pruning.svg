<svg class="jd-svg" data-jd-theme="" width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .box-fill { fill: var(--jd-surface-raised, #161b22); }
    .jd-svg .box-stroke { stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .info { fill: var(--jd-note-ink, #58a6ff); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .ok { fill: var(--jd-ok-ink, #3fb950); }
    .jd-svg .warm { fill: var(--jd-warn-ink, #f78166); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="sub" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- requête -->
  <g>
    <rect class="box-fill box-stroke" x="8" y="118" width="152" height="64" rx="4"/>
    <rect class="info" x="8" y="118" width="4" height="64"/>
    <text class="ink" x="24" y="140" font-size="12">Requête</text>
    <text class="sub" x="24" y="158" font-size="10">matcher sur</text>
    <text class="sub" x="24" y="172" font-size="10">k8s_cluster_name="A"</text>
  </g>

  <!-- querier global -->
  <path class="edge" d="M 160 150 L 190 150" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <g>
    <rect class="box-fill box-stroke" x="196" y="118" width="118" height="64" rx="4"/>
    <rect class="sub" x="196" y="118" width="4" height="64"/>
    <text class="ink" x="210" y="140" font-size="12">Querier global</text>
    <text class="sub" x="210" y="158" font-size="10">compare le matcher</text>
    <text class="sub" x="210" y="172" font-size="10">au label annoncé</text>
  </g>

  <!-- stack 1 : compatible -->
  <path class="edge" d="M 314 144 C 342 144, 346 46, 372 46" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <g>
    <rect class="box-fill box-stroke" x="378" y="14" width="254" height="64" rx="4"/>
    <rect class="ok" x="378" y="14" width="4" height="64"/>
    <text class="ink" x="394" y="36" font-size="12">Stack A</text>
    <text class="sub" x="394" y="54" font-size="10">annonce {…, k8s_cluster_name="A"}</text>
    <text class="ok" x="394" y="70" font-size="10">compatible, interrogée</text>
  </g>

  <!-- stack 2 : contredite, élaguée -->
  <path class="edge" d="M 314 150 L 372 150" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>
  <g>
    <rect class="box-fill box-stroke" x="378" y="118" width="254" height="64" rx="4"/>
    <rect class="sub" x="378" y="118" width="4" height="64"/>
    <text class="ink" x="394" y="140" font-size="12">Stack B</text>
    <text class="sub" x="394" y="158" font-size="10">annonce {…, k8s_cluster_name="B"}</text>
    <text class="sub" x="394" y="174" font-size="10">contredite, écartée</text>
  </g>

  <!-- stack 3 : rien à contredire -->
  <path class="edge" d="M 314 156 C 342 156, 346 254, 372 254" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <g>
    <rect class="box-fill box-stroke" x="378" y="222" width="254" height="64" rx="4"/>
    <rect class="warm" x="378" y="222" width="4" height="64"/>
    <text class="ink" x="394" y="244" font-size="12">Stack sans selector-label</text>
    <text class="sub" x="394" y="262" font-size="10">annonce {receive_prometheus=…}</text>
    <text class="warm" x="394" y="278" font-size="10">rien à contredire, interrogée</text>
  </g>

  <!-- légende -->
  <text class="page" x="8" y="212" font-size="11" font-weight="600">Une stack n'est écartée</text>
  <text class="page" x="8" y="228" font-size="11" font-weight="600">que sur un label</text>
  <text class="page" x="8" y="244" font-size="11" font-weight="600">qu'elle annonce.</text>
</svg>
