<svg class="jd-svg" data-jd-theme="" width="640" height="124" viewBox="0 0 640 124" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <style>
    .jd-svg text { font-family: var(--jd-sans, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif); }
    .jd-svg .box { fill: var(--jd-surface-raised, #161b22); stroke: var(--jd-border-strong, #30363d); }
    .jd-svg .ink { fill: var(--jd-ink, #e6edf3); }
    .jd-svg .sub { fill: var(--jd-muted, #8b949e); }
    .jd-svg .page { fill: var(--jd-muted, #6e7781); font-weight: 600; }
    .jd-svg .edge { stroke: var(--jd-muted, #8b949e); }
    .jd-svg .neutral { fill: var(--jd-muted, #8b949e); }
    .jd-svg .ok { fill: var(--jd-ok-ink, #3fb950); }
    .jd-svg .info { fill: var(--jd-note-ink, #58a6ff); }
    .jd-svg .warm { fill: var(--jd-warn-ink, #f78166); }
    .jd-svg .bad { fill: var(--jd-bad-ink, #f85149); }
    .jd-svg .warm-t { fill: var(--jd-warn-ink, #f78166); font-weight: 600; }
    .jd-svg .bad-t { fill: var(--jd-bad-ink, #f85149); font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="neutral" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- axe : WAL retenu par le slot, pas à l'échelle -->
  <text class="page" x="4" y="14" font-size="10">WAL retenu par le slot</text>
  <line class="edge" x1="4" y1="40" x2="632" y2="40" stroke-width="1.5" marker-end="url(#arr)"/>

  <line class="edge" x1="123" y1="34" x2="123" y2="46" stroke-width="1.5"/>
  <line class="edge" x1="230" y1="34" x2="230" y2="46" stroke-width="1.5"/>
  <line class="edge" x1="340" y1="34" x2="340" y2="46" stroke-width="1.5"/>
  <line class="edge" x1="423" y1="34" x2="423" y2="46" stroke-width="1.5"/>

  <text class="warm-t" x="230" y="29" font-size="10" text-anchor="middle">alerte warning (50 %)</text>
  <text class="bad-t" x="340" y="29" font-size="10" text-anchor="middle">critical (75 %)</text>
  <text class="page" x="123" y="58" font-size="10" text-anchor="middle">max_wal_size</text>
  <text class="page" x="423" y="58" font-size="10" text-anchor="middle">max_slot_wal_keep_size</text>

  <!-- états de wal_status -->
  <g>
    <rect class="box" x="4" y="68" width="116" height="48" rx="4"/>
    <rect class="ok" x="4" y="68" width="4" height="48"/>
    <text class="ink" x="16" y="88" font-size="12">reserved</text>
    <text class="sub" x="16" y="104" font-size="10">dans max_wal_size</text>
  </g>
  <g>
    <rect class="box" x="126" y="68" width="294" height="48" rx="4"/>
    <rect class="info" x="126" y="68" width="4" height="48"/>
    <text class="ink" x="138" y="88" font-size="12">extended</text>
    <text class="sub" x="138" y="104" font-size="10">au-delà de max_wal_size, toujours retenu</text>
  </g>
  <g>
    <rect class="box" x="426" y="68" width="100" height="48" rx="4"/>
    <rect class="warm" x="426" y="68" width="4" height="48"/>
    <text class="ink" x="438" y="88" font-size="12">unreserved</text>
    <text class="sub" x="438" y="104" font-size="10">peut revenir</text>
  </g>
  <g>
    <rect class="box" x="532" y="68" width="104" height="48" rx="4"/>
    <rect class="bad" x="532" y="68" width="4" height="48"/>
    <text class="ink" x="544" y="88" font-size="12">lost</text>
    <text class="sub" x="544" y="104" font-size="10">resync complète</text>
  </g>
</svg>
