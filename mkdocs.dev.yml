# Local preview only: same theme and hooks, without the plugins that only matter in
# production (social cards, feeds, privacy downloads, redirects).
# search stays: hooks/article_meta.py writes into its output directory.
INHERIT: mkdocs.yml

# Glossary and theme overrides live outside docs/, so serve would not rebuild on them
watch:
  - includes
  - overrides

plugins:
  - meta
  - document-dates:
      show_created: false
      show_updated: false
      show_author: false
  - glightbox
  - search:
      # jd-palette.js reads search/search_index.json, only the Lunr provider writes it.
      provider: lunr
      lunr:
        lang:
          - fr
  - tags
