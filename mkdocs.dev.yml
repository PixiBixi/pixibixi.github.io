# Local preview only: same theme and hooks, without the plugins that only matter in
# production (social cards, feeds, privacy downloads, redirects).
# search stays: the Cmd+K palette and the 404 suggestions query its Pagefind index.
INHERIT: mkdocs.yml

# Glossary and theme overrides live outside docs/, so serve would not rebuild on them
watch:
  - includes
  - overrides

plugins:
  - meta
  - document-dates:
      show_created: false
      show_updated: false
      show_author: false
  - glightbox
  - search:
      provider: pagefind
      pagefind:
        # Pretty URLs in jd-palette.js and the 404 suggestions, like every other link on the site.
        keep_index_url: false
        # Theme chrome rendered inside the article: Lunr never saw it, and backlinks or prev/next titles would match other pages.
        exclude_selectors:
          - nav
          - footer
          - .jd-toc-bar
          - .jd-meta
          - .jd-pn
          - .jd-backlinks
          - .jd-outdated
          - .jd-series
          - .jd-skill
          - .jd-tested
          - .jd-cat__meta
          - .jd-cat__toolbar
          - .jd-cat__list
          - .jd-cat__groups
          - .jd-cat__empty
  - tags
